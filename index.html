<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주배당 통장</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#173A40">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="주배당 통장">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#E6EEEB; --paper:#F7FBF9; --ink:#173A40; --muted:#5F7B77; --rule:#C6D6D1;
  --red:#D2343A; --red-soft:#F6D9DA; --blue:#2F6FB5; --blue-soft:#DCE8F6; --cell0:#DCE7E3;
  --shadow:0 1px 0 rgba(23,58,64,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1E1D; --paper:#172A29; --ink:#E1EDEA; --muted:#8FA8A4; --rule:#2C4442;
    --red:#FF6A6A; --red-soft:#4A2324; --blue:#7FB0EA; --blue-soft:#1E3550; --cell0:#213634; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1E1D; --paper:#172A29; --ink:#E1EDEA; --muted:#8FA8A4; --rule:#2C4442;
  --red:#FF6A6A; --red-soft:#4A2324; --blue:#7FB0EA; --blue-soft:#1E3550; --cell0:#213634; --shadow:none;
}
/* ---- 추가 테마: 토스 스타일 ---- */
:root[data-palette="toss"]{ --bg:#F2F4F6; --paper:#FFFFFF; --ink:#191F28; --muted:#8B95A1; --rule:#E5E8EB; --red:#F04452; --red-soft:#FDE8EA; --blue:#3182F6; --blue-soft:#E8F3FF; --cell0:#EEF1F4; --shadow:none; --accent:#3182F6; --accent-fg:#fff; --btn:#3182F6; --btn-fg:#fff; }
@media (prefers-color-scheme: dark){ :root[data-palette="toss"]:not([data-theme="light"]){ --bg:#101013; --paper:#1D1D22; --ink:#F2F2F5; --muted:#8E8E98; --rule:#2B2B33; --red:#F2545F; --red-soft:#3A1F23; --blue:#4D94FF; --blue-soft:#17263D; --cell0:#26262D; } }
:root[data-palette="toss"] .card{border-color:transparent;border-radius:20px}
:root[data-palette="toss"] .stat{border-color:transparent;background:var(--bg);border-radius:14px}
:root[data-palette="toss"] .hero .big{color:var(--ink)}
/* ---- 추가 테마: 카카오페이 스타일 ---- */
:root[data-palette="kakao"]{ --bg:#F6F6F6; --paper:#FFFFFF; --ink:#191919; --muted:#8A8A8A; --rule:#E8E8E8; --red:#FF5A4F; --red-soft:#FFE7E5; --blue:#3C7CF0; --blue-soft:#E7EFFD; --cell0:#EFEFEF; --shadow:none; --accent:#FEE500; --accent-fg:#191919; --btn:#FEE500; --btn-fg:#191919; }
@media (prefers-color-scheme: dark){ :root[data-palette="kakao"]:not([data-theme="light"]){ --bg:#121212; --paper:#1E1E1E; --ink:#EDEDED; --muted:#9A9A9A; --rule:#2E2E2E; --red:#FF6B61; --red-soft:#3D2220; --blue:#6A9BFF; --blue-soft:#1E2A40; --cell0:#2A2A2A; } }
:root[data-palette="kakao"] .card{border-color:transparent;border-radius:16px}
:root[data-palette="kakao"] .hero{background:var(--accent);color:#191919}
:root[data-palette="kakao"] .hero .label,:root[data-palette="kakao"] .hero .sub,:root[data-palette="kakao"] .hero .muted,:root[data-palette="kakao"] .hero .strip-legend{color:rgba(25,25,25,.65)}
:root[data-palette="kakao"] .hero .big{color:#191919}
:root[data-palette="kakao"] .hero .strip .c{background:rgba(25,25,25,.10)}
:root[data-palette="kakao"] .hero .bar{background:rgba(25,25,25,.12)}
:root[data-palette="kakao"] .hero .bar > span{background:#191919}
:root[data-palette="kakao"] .hero .stat{background:rgba(255,255,255,.55);border-color:transparent}
:root[data-palette="kakao"] .hero .stat .v{color:#191919}
/* 공통 추가 */
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;-webkit-overflow-scrolling:touch}
.chips button{flex:none;border-radius:999px;padding:7px 14px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--btn,var(--ink));color:var(--btn-fg,var(--paper));border-color:var(--btn,var(--ink));font-weight:600}
.chg{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.chg.up{color:var(--red)} .chg.down{color:var(--blue)}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--rule);text-align:right}
.tbl th{color:var(--muted);font-weight:500;font-size:12px;background:var(--paper);position:sticky;top:0}
.tbl .l{text-align:left}
.tbl tr[data-edit],.tbl tr[data-plan]{cursor:pointer}
.tbl tr.wk td{border-top:2px solid var(--rule)}
.tbl tr.cur td{background:var(--red-soft)}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sw{padding:10px 8px;text-align:center;font-size:13px}
.sw .dots{display:flex;justify-content:center;gap:4px;margin-bottom:6px}
.sw .dots i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
.sw[aria-pressed="true"]{border:2px solid var(--ink);font-weight:700}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:620px;margin:0 auto;padding:16px 16px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px 14px}
header.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.chip{font-size:12px;color:var(--muted);border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:5px 10px;white-space:nowrap}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero .label{font-size:13px;color:var(--muted)}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:2px 0 4px;color:var(--red)}
.sub,.muted{font-size:13px;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;margin-top:16px}
.strip .c{aspect-ratio:1;border-radius:4px;background:var(--cell0)}
.strip .c.now{outline:2px solid var(--ink);outline-offset:1px}
.strip-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{padding:12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:18px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up{color:var(--red)} .down{color:var(--blue)}
h2{font-size:15px;margin:0 0 10px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 small{font-weight:400;font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--rule)}
.row:first-of-type{border-top:none}
.dayhead{font-size:12px;color:var(--muted);padding:10px 0 2px}
.dayhead.sep{border-top:1px solid var(--rule);margin-top:4px}
.dayhead + .row{border-top:none}
.row .l{min-width:0}
.row .t{font-weight:600}
.row .s{font-size:12px;color:var(--muted)}
.row .r{text-align:right;white-space:nowrap}
.amt{font-weight:600;color:var(--red)}
.weekhead{font-size:12px;color:var(--muted);padding:14px 2px 4px;display:flex;justify-content:space-between}
.empty{text-align:center;color:var(--muted);padding:26px 8px;font-size:14px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:10px 14px}
button.primary{background:var(--btn,var(--ink));color:var(--btn-fg,var(--paper));border-color:var(--btn,var(--ink));font-weight:600}
button.ghost{background:transparent}
button.danger{color:var(--red);border-color:var(--red-soft)}
button.small{padding:6px 10px;font-size:13px}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow button{flex:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:620px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:none;border-radius:0;background:transparent;padding:12px 2px 10px;color:var(--muted);font-size:13px}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--accent,var(--red))}
.fab{position:fixed;right:max(16px,calc(50% - 294px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:11;
  border-radius:999px;padding:14px 20px;background:var(--accent,var(--red));color:var(--accent-fg,#fff);border:none;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.fab[hidden]{display:none}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--bg);color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,25,25,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--paper);width:100%;max-width:620px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 4px;font-size:17px}
.hint{font-size:13px;color:var(--muted);margin:0 0 8px}
.batch-item{border-top:1px solid var(--rule);padding:10px 0}
.batch-item .top{display:flex;justify-content:space-between;align-items:center}
.calc{font-size:12px;color:var(--muted);margin-top:4px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600}
.chk input{width:18px;height:18px;flex:none}
.preview{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--red-soft);font-size:14px}
.seg{display:flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:none;border-radius:0;padding:8px 4px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--btn,var(--ink));color:var(--btn-fg,var(--paper))}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.bar{height:10px;border-radius:999px;background:var(--cell0);overflow:hidden;margin-top:8px}
.bar > span{display:block;height:100%;background:var(--red);border-radius:999px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--rule);color:var(--muted);margin-left:4px;vertical-align:1px}
.yield{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--blue-soft);color:var(--blue);margin-top:3px}
details.help{font-size:13px;color:var(--muted);margin-top:10px}
details.help summary{cursor:pointer;color:var(--ink)}
details.help ol{padding-left:18px;margin:8px 0}
/* 연도별 한눈에 */
.ygrid{display:grid;grid-template-columns:38px repeat(12,1fr);gap:3px;align-items:center}
.ygrid .yh{font-size:10.5px;color:var(--muted);text-align:center}
.ygrid .yl{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.yc{aspect-ratio:1;border-radius:5px;background:var(--cell0);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);overflow:hidden;min-width:0}
.yc.fut{background:transparent;border:1px dashed var(--rule);color:var(--muted);font-weight:400}
.yc.now{outline:2px solid var(--ink);outline-offset:1px}
.tbl input.inv{width:96px;padding:6px 8px;text-align:right;font-size:16px;background:var(--bg)}
.card.notice{border:1.5px solid var(--red)}
.tbl tr.tot td{border-top:2px solid var(--rule);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>주배당 통장</h1><button class="chip" id="syncChip" type="button">이 기기에 저장됨</button></header>
  <main id="view"></main>
</div>
<button class="fab" id="fab">+ 이번 주 배당</button>
<nav class="tabs"><div class="in" role="tablist">
  <button role="tab" data-tab="home" aria-selected="true">요약</button>
  <button role="tab" data-tab="log" aria-selected="false">기록</button>
  <button role="tab" data-tab="hold" aria-selected="false">보유</button>
  <button role="tab" data-tab="chart" aria-selected="false">그래프</button>
  <button role="tab" data-tab="plan" aria-selected="false">계획</button>
  <button role="tab" data-tab="set" aria-selected="false">설정</button>
</div></nav>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const LS_KEY = "weekly-div-journal-v1";
const DEFAULT = {
  v:2,
  settings:{ fx:1380, fxDate:"", taxUS:15, taxKR:15.4, autoFx:true, goalMonthly:0, baseYield:0.85, goalBasis:"gross", planSeeded:false, tdKey:"", gClientId:"", gLinked:false, updated:0 },
  holdings:[], entries:[], plan:[], invest:[], deleted:[], fxCache:{}, priceCache:{}, quotes:{}
};
let S = clone(DEFAULT);
let tab = "home", chartMode = "month", logMode = "list", tickerSel = "all", homeYear = null, investYear = null;
let renderTimer = null;

// ---------- utils ----------
function clone(o){ return JSON.parse(JSON.stringify(o)); }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const won = n => (n<0?"-":"") + "₩" + Math.round(Math.abs(n)).toLocaleString("ko-KR");
const wonS = n => (n>0?"+":"") + won(n);
const usd = n => (n<0?"-":"") + "$" + Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = (n,d=2) => (n>0?"+":"") + n.toFixed(d) + "%";
const cls = n => n>0?"up":n<0?"down":"";
const isoOf = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayStr = () => isoOf(new Date());
const parseD = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const fmtD = d => `${d.getMonth()+1}/${d.getDate()}`;
function monday(d){ const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; }
const weekKey = s => isoOf(monday(parseD(s)));
const addDays = (s,n) => { const d=parseD(s); d.setDate(d.getDate()+n); return isoOf(d); };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const holdingOf = t => S.holdings.find(h=>h.ticker===t);
const freqN = t => { const f=(holdingOf(t)||{}).freq||"주배당"; return f==="월배당"?12:f==="분기배당"?4:52; };
const taxFor = cur => cur==="KRW"? S.settings.taxKR : S.settings.taxUS;
const online = () => navigator.onLine !== false;

function calc(e){
  const gross = e.perShare * e.shares, tax = gross*(e.taxRate/100), net = gross - tax;
  const fx = e.currency==="KRW" ? 1 : e.fx;
  const y = e.price>0 ? e.perShare/e.price*100 : null;
  return { gross, tax, net, netKRW: net*fx, grossKRW: gross*fx, yield:y, yieldAnnual: y!=null ? y*freqN(e.ticker) : null };
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
async function fetchJSON(url, opts={}, ms=8000){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  try{ const r=await fetch(url,Object.assign({signal:c.signal,cache:"no-store"},opts)); if(!r.ok){ const err=new Error("HTTP "+r.status); err.status=r.status; throw err; } return await r.json(); }
  finally{ clearTimeout(t); }
}
function softRender(){ clearTimeout(renderTimer); renderTimer=setTimeout(()=>{ const a=document.activeElement; if(a&&a.matches&&a.matches("#view input,#view select,#view textarea")){ softRender(); return; } if(!$("#sheetBg").classList.contains("open")) render(); },250); }

// ---------- theme ----------
const THEMES={ teal:{name:"청록 통장",dots:["#E6EEEB","#173A40","#D2343A"],meta:"#173A40"}, toss:{name:"토스 스타일",dots:["#F2F4F6","#191F28","#3182F6"],meta:"#F2F4F6"}, kakao:{name:"카카오페이 스타일",dots:["#FFFFFF","#191919","#FEE500"],meta:"#FEE500"} };
function getTheme(){ try{ return localStorage.getItem("jb-theme")||"teal"; }catch(e){ return "teal"; } }
function applyTheme(t){
  if(!THEMES[t]) t="teal";
  if(t==="teal") document.documentElement.removeAttribute("data-palette"); else document.documentElement.setAttribute("data-palette",t);
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",THEMES[t].meta);
  try{ localStorage.setItem("jb-theme",t); }catch(e){}
}
applyTheme(getTheme());

// ---------- storage ----------
function normalize(p){
  const o = Object.assign(clone(DEFAULT), p||{});
  o.settings = Object.assign(clone(DEFAULT.settings), (p&&p.settings)||{});
  for(const k of ["holdings","entries","plan","invest","deleted"]) if(!Array.isArray(o[k])) o[k]=[];
  for(const k of ["fxCache","priceCache","quotes"]) if(!o[k]||typeof o[k]!=="object") o[k]={};
  o.entries.forEach(e=>{ if(e.fxAuto===undefined) e.fxAuto=false; });
  return o;
}
function loadLocal(){ try{ const r=localStorage.getItem(LS_KEY); if(r) S=normalize(JSON.parse(r)); }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function persist(){ saveLocal(); Drive.schedulePush(); }
function touchSettings(){ S.settings.updated = Date.now(); }

// ---------- exchange rate (자동) ----------
async function getFx(date){
  const isToday = date >= todayStr();
  if(S.fxCache[date] && !isToday) return {rate:S.fxCache[date], src:"saved"};
  if(online()){
    const q = isToday ? "latest" : date;
    const urls=[`https://api.frankfurter.dev/v1/${q}?base=USD&symbols=KRW`,`https://api.frankfurter.app/${q}?from=USD&to=KRW`];
    for(const u of urls){ try{ const j=await fetchJSON(u,{},6000); const r=j&&j.rates&&+j.rates.KRW;
      if(r>0){ const v=Math.round(r*100)/100; S.fxCache[isToday?todayStr():date]=v; return {rate:v,src:"live",base:j.date}; } }catch(e){} }
    if(isToday){ try{ const j=await fetchJSON("https://open.er-api.com/v6/latest/USD",{},6000); const r=j&&j.rates&&+j.rates.KRW;
      if(r>0){ const v=Math.round(r*100)/100; S.fxCache[todayStr()]=v; return {rate:v,src:"live"}; } }catch(e){} }
  }
  if(S.fxCache[date]) return {rate:S.fxCache[date],src:"saved"};
  return {rate:S.settings.fx, src:"offline"};
}
async function refreshTodayFx(){
  const r = await getFx(todayStr());
  if(r.src!=="offline"){ S.settings.fx=r.rate; S.settings.fxDate=todayStr(); saveLocal(); softRender(); }
}
async function backfillFx(){

// ---------- stock prices (Twelve Data, 미국 주식/ETF) ----------
const TD = {
  stamps:[],
  async call(path, credits=1){
    const key=S.settings.tdKey; if(!key) throw new Error("nokey");
    // 무료 요금제: 분당 8크레딧
    for(;;){ const now=Date.now(); this.stamps=this.stamps.filter(t=>now-t.at<61000);
      const used=this.stamps.reduce((a,t)=>a+t.n,0); if(used+credits<=8) break;
      await sleep(61000-(now-this.stamps[0].at)); }
    this.stamps.push({at:Date.now(),n:credits});
    const j = await fetchJSON(`https://api.twelvedata.com/${path}${path.includes("?")?"&":"?"}apikey=${encodeURIComponent(key)}`,{},10000);
    if(j && j.status==="error"){ const err=new Error(j.message||"error"); err.code=j.code; throw err; }
    return j;
  }
};
async function priceOn(ticker, date){
  S.priceCache[ticker]=S.priceCache[ticker]||{};
  if(S.priceCache[ticker][date]) return S.priceCache[ticker][date];
  const j = await TD.call(`time_series?symbol=${encodeURIComponent(ticker)}&interval=1day&start_date=${addDays(date,-7)}&end_date=${addDays(date,1)}&outputsize=10`);
  const vals=(j.values||[]).filter(v=>v.datetime.slice(0,10)<=date).sort((a,b)=>b.datetime.localeCompare(a.datetime));
  if(!vals.length) return null;
  const p=Math.round(+vals[0].close*10000)/10000; S.priceCache[ticker][date]=p; return p;
}
let priceBusy=false;
async function backfillPrices(){
  if(priceBusy || !S.settings.tdKey || !online()) return; priceBusy=true;
  try{
    for(const e of S.entries){
      if(e.currency==="KRW" || e.price>0 || e.priceFail) continue;
      try{ const p=await priceOn(e.ticker,e.date); if(p){ e.price=p; e.updated=Date.now(); } else e.priceFail=true; persist(); softRender(); }
      catch(err){ if(err.message==="nokey"||err.code===401||err.code===429) break; e.priceFail=true; }
    }
  } finally{ priceBusy=false; }
}
let quoteBusy=false;
async function refreshQuotes(force){
  if(quoteBusy || !S.settings.tdKey || !online()) return false;
  const syms=[...new Set(S.holdings.filter(h=>h.currency!=="KRW").map(h=>h.ticker))];
  if(!syms.length) return false;
  const stale = syms.some(t=>!S.quotes[t] || Date.now()-S.quotes[t].at > 15*60000);
  if(!force && !stale) return false;
  quoteBusy=true;
  try{
    for(let i=0;i<syms.length;i+=8){
      const part=syms.slice(i,i+8);
      const j=await TD.call(`price?symbol=${part.map(encodeURIComponent).join(",")}`, part.length);
      if(part.length===1){ if(j.price) S.quotes[part[0]]={price:+j.price,at:Date.now()}; }
      else for(const t of part){ if(j[t]&&j[t].price) S.quotes[t]={price:+j[t].price,at:Date.now()}; }
    }
    saveLocal(); softRender(); return true;
  }catch(e){ if(force) toast(e.message==="nokey"?"설정에서 주가 API 키를 먼저 넣어 주세요":"주가를 불러오지 못했어요"); return false; }
  finally{ quoteBusy=false; }
}
function curPrice(h){ if(h.currency!=="KRW" && S.quotes[h.ticker]) return S.quotes[h.ticker].price; return h.manualPrice>0?h.manualPrice:null; }

// ---------- merge (기기 간 합치기) ----------
function markDeleted(id){ if(!S.deleted.includes(id)) S.deleted.push(id); }
function mergeList(mine, theirs, dead){
  const m=new Map(mine.map(x=>[x.id,x])); let added=0;
  for(const t of theirs||[]){ const cur=m.get(t.id);
    if(!cur){ m.set(t.id,t); added++; } else if((t.updated||t.created||0)>(cur.updated||cur.created||0)) m.set(t.id,t); }
  return {list:[...m.values()].filter(x=>!dead.has(x.id)), added};
}
function mergeIn(raw){
  const p=normalize(raw);
  const dead=new Set([...S.deleted,...p.deleted]);
  const e=mergeList(S.entries,p.entries,dead), h=mergeList(S.holdings,p.holdings,dead);
  const pl=mergeList(S.plan,p.plan,dead), iv=mergeList(S.invest,p.invest,dead); S.entries=e.list; S.holdings=h.list; S.plan=pl.list; S.invest=iv.list; S.deleted=[...dead];
  if((p.settings.updated||0) > (S.settings.updated||0)){ const keep={gLinked:S.settings.gLinked}; S.settings=Object.assign(p.settings,keep); }
  S.fxCache=Object.assign({},p.fxCache,S.fxCache);
  for(const t in p.priceCache) S.priceCache[t]=Object.assign({},p.priceCache[t],S.priceCache[t]||{});
  for(const t in p.quotes) if(!S.quotes[t] || p.quotes[t].at>S.quotes[t].at) S.quotes[t]=p.quotes[t];
  return e.added;
}

const Drive = {
  token:null, exp:0, fileId:null, client:null, busy:false, timer:null, lastSync:0, status:"",
  FILE:"jubaedang.json",
  ready(){ return !!(this.token && Date.now()<this.exp-60000); },
  loadGIS(){
    if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
    if(this._p) return this._p;
    this._p = new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://accounts.google.com/gsi/client"; s.async=true;
      s.onload=()=>res(); s.onerror=()=>{ this._p=null; rej(new Error("gis")); }; document.head.appendChild(s); });
    return this._p;

  async auth(){
    if(!S.settings.gClientId) throw new Error("noclient");
    await this.loadGIS();
    return new Promise((res,rej)=>{
      this.client = google.accounts.oauth2.initTokenClient({
        client_id:S.settings.gClientId.trim(),
        scope:"https://www.googleapis.com/auth/drive.appdata",
        callback:(r)=>{ if(r && r.access_token){ this.token=r.access_token; this.exp=Date.now()+(+r.expires_in||3600)*1000; res(); } else rej(new Error(r&&r.error||"auth")); },
        error_callback:(e)=>rej(new Error(e&&e.type||"auth"))

      this.client.requestAccessToken({prompt: S.settings.gLinked ? "" : "consent"});
    });
  },
  async api(url, opts={}){
    const o=Object.assign({},opts); o.headers=Object.assign({Authorization:"Bearer "+this.token},opts.headers||{});
    const r=await fetch(url,o); if(r.status===401){ this.token=null; throw new Error("expired"); }
    if(!r.ok){ let t=""; try{ t=await r.text(); }catch(e){}
      if(r.status===403 && /has not been used|is disabled|accessNotConfigured|SERVICE_DISABLED/i.test(t)) throw new Error("driveoff");
      if(r.status===403 && /insufficient|scope/i.test(t)) throw new Error("scope");

  },
  async findFile(){
    if(this.fileId) return this.fileId;

    const j=await this.api(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)&orderBy=modifiedTime desc`);
    this.fileId = j.files && j.files[0] ? j.files[0].id : null; return this.fileId;
  },
  payload(){ const o=clone(S); return JSON.stringify(o); },
  async upload(){
    const body=this.payload();
    if(this.fileId){
      await this.api(`https://www.googleapis.com/upload/drive/v3/files/${this.fileId}?uploadType=media`,{method:"PATCH",headers:{"Content-Type":"application/json"},body});
    } else {
      const b="jb"+Date.now(), meta=JSON.stringify({name:this.FILE,parents:["appDataFolder"]});
      const multi=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
      const j=await this.api(`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id`,{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body:multi});
      this.fileId=j.id;
    }
  },
  async sync(interactive){
    if(this.busy) return; if(!online()){ if(interactive) toast("인터넷 연결 후 동기화할 수 있어요"); return; }
    this.busy=true; this.setChip("동기화 중…");
    try{

      if(!S.settings.gLinked){ S.settings.gLinked=true; }
      const id=await this.findFile();
      let added=0;
      if(id){ const remote=await this.api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`); const data=typeof remote==="string"?JSON.parse(remote):remote; added=mergeIn(data); }
      saveLocal(); await this.upload();
      this.lastSync=Date.now(); this.status="ok";
      if(interactive) toast(added?`동기화 완료 · 새 기록 ${added}건`:"동기화 완료");
      render();
    }catch(e){
      this.status="err";
      if(interactive){
        const m=e.message;
        toast(m==="noclient"?"설정에서 구글 클라이언트 ID를 먼저 넣어 주세요": m==="gis"?"구글 로그인을 불러오지 못했어요 (인터넷 확인)": m==="popup_closed"||m==="access_denied"?"구글 로그인이 취소됐어요":
          m==="driveoff"?"구글 클라우드에서 Google Drive API를 ‘사용’으로 켜 주세요": m==="scope"?"로그인할 때 드라이브 접근 허용에 체크해 주세요": m==="expired"?"다시 한 번 눌러 로그인해 주세요": m==="popup_failed_to_open"?"팝업이 막혔어요. 브라우저에서 팝업을 허용해 주세요": `동기화 실패 (${m})`);
      }
    }finally{ this.busy=false; this.setChip(); }
  },
  schedulePush(){
    this.setChip();

  },
  setChip(t){

    if(t){ c.textContent=t; return; }

    else c.textContent = "☁ 눌러서 동기화";
  }
};

function lineChart({labels, series, H=210, labelEvery=1, fmt=kfmt, fromZero=true}){

// 평단: USD 종목은 달러 평단(avgCost)·원화 평단(avgCostKRW)·매수 환율(buyFx) 중 두 개가 있으면 나머지를 계산
function holdCalc(h){
  const fx=S.settings.fx, s=h.shares, p=curPrice(h);
  if(h.currency==="KRW"){ const a=+h.avgCost||0, cost=a*s, val=p?p*s:null; return {p,cost,val,aU:null,aK:a,buyFx:null,pricePL:val!=null&&a?val-cost:null,fxPL:null}; }
  let aU=+h.avgCost||0, aK=+h.avgCostKRW||0; const bf=+h.buyFx||0;
  if(!aU && aK && bf) aU=aK/bf;
  if(!aK && aU && bf) aK=aU*bf;
  const cost = aK ? aK*s : aU*s*fx, val = p ? p*s*fx : null, split = !!(aU&&aK), buyFx = split ? aK/aU : null;
  return {p,cost,val,aU,aK,buyFx, pricePL: val!=null&&aU ? (p-aU)*s*fx : null, fxPL: split ? aU*s*(fx-buyFx) : null};
}
function portfolio(){

  for(const h of S.holdings){ const c=holdCalc(h), d=dv[h.ticker]||0;

      return seg+chips+`<section class="card"><h2>${y}년 종목별 비중 (세후)</h2>${donut(Object.entries(o).sort((a,b)=>b[1]-a[1]))}<p class="muted" style="margin:10px 0 0">위에서 종목을 고르면 그 종목만 날짜별로 볼 수 있어요.</p></section>`; }
    return seg+chips+tickerDetail(tickerSel);
  }
  const months=new Array(12).fill(0).map((_,i)=>actualYm(ymOf(y,i),b)), goals=months.map((_,i)=>goalFor(y,i)), hasGoal=goals.some(g=>g>0);
  const firstThisYear=S.entries.map(e=>e.date).filter(d=>d.startsWith(y+"-")).sort()[0];
  const startM=firstThisYear?parseD(firstThisYear).getMonth():0, cm=now.getMonth();
  const dim=new Date(y,cm+1,0).getDate();
  let startG=startM; while(startG<cm && !(goals[startG]>0)) startG++;
  let goalToDate=0; for(let i=startG;i<cm;i++) goalToDate+=goals[i]; goalToDate+=goals[cm]*now.getDate()/dim;
  const actToDate=months.slice(startG,cm+1).reduce((a,v)=>a+v,0);
  const goalCard = hasGoal ? `<section class="card"><h2>목표 대비 <small>${basisName()} 기준</small></h2>
    <div class="stats" style="margin:0">
      <div class="stat"><div class="k">${cm+1}월</div><div class="v num">${goals[cm]?Math.round(months[cm]/goals[cm]*100)+"%":"-"}</div><div class="s" style="font-size:12px">${won(months[cm])} / ${won(goals[cm])}</div></div>
      <div class="stat"><div class="k">${startG===cm?"이번 달 지금까지":(startG+1)+"월부터 지금까지"}</div><div class="v num">${goalToDate?Math.round(actToDate/goalToDate*100):0}%</div><div class="s" style="font-size:12px">${won(actToDate)} / ${won(goalToDate)}</div></div>
    </div></section>`
    : `<section class="card"><div class="muted">계획 탭에서 <b>월별 목표</b>를 정하면 받은 금액과 목표를 그래프로 비교할 수 있어요.</div><div class="btnrow" style="margin-top:10px"><button id="goPlan">계획 탭으로</button></div></section>`;
  let body="";
  if(chartMode==="month"){
    body=`<section class="card"><h2>${y}년 월별 배당 <small>${basisName()}</small></h2>${barChart({labels:months.map((_,i)=>(i+1)+"월"),values:months,target:hasGoal?goals:0})}
      <div class="legend"><span><i style="background:var(--red)"></i>받은 배당</span>${hasGoal?`<span><i style="background:var(--blue)"></i>그달 목표</span><span>흐린 막대: 목표 미달</span>`:""}</div></section>`;
  } else if(chartMode==="week"){
    const wk=new Map(); for(const e of S.entries){ const k=weekKey(e.date); wk.set(k,(wk.get(k)||0)+amtOf(e,b)); }
    const m0=monday(now), labels=[], vals=[], tg=[];
    for(let i=15;i>=0;i--){ const m=new Date(m0); m.setDate(m.getDate()-7*i); const k=isoOf(m); labels.push(weekLabel(k).replace("주차","주")); vals.push(wk.get(k)||0); tg.push(weekGoal(k)); }
    body=`<section class="card"><h2>최근 16주 <small>${basisName()}</small></h2>${barChart({labels,values:vals,target:hasGoal?tg:0,labelEvery:3})}
      <div class="legend"><span><i style="background:var(--red)"></i>받은 배당</span>${hasGoal?`<span><i style="background:var(--blue)"></i>주간 목표 (월 목표×12÷52)</span>`:""}</div></section>`;
  } else {
    const labels=[], act=[], tgt=[]; let run=0, trun=0;
    for(let i=0;i<12;i++){ labels.push((i+1)+"월"); if(i<=cm){ run+=months[i]; act.push(i>=startM||run>0?run:null); } else act.push(null);
      if(i>=startM){ trun+=goals[i]; tgt.push(trun); } else tgt.push(null); }
    const series=[{values:act,color:"var(--red)"}]; if(hasGoal) series.push({values:tgt,color:"var(--blue)",dash:true});
    body=`<section class="card"><h2>${y}년 누적 배당 <small>${basisName()} ${won(months.reduce((a,v)=>a+v,0))}</small></h2>${lineChart({labels,series,labelEvery:2})}
      <div class="legend"><span><i style="background:var(--red)"></i>실제 누적</span>${hasGoal?`<span><i style="background:var(--blue)"></i>목표 누적</span>`:""}</div></section>`;
  }
  return seg+goalCard+body;
}

function yearOverview(){
  const now=new Date(), cy=now.getFullYear(), curYm=ymOf(cy,now.getMonth()), b=basis(), inv=investMap();
  const act={}; for(const e of S.entries){ const ym=e.date.slice(0,7); act[ym]=(act[ym]||0)+amtOf(e,b); }
  const starts=[...S.entries.map(e=>e.date.slice(0,7)), ...S.plan.map(p=>p.ym)].sort();
  const startYm=starts[0]||curYm;
  const ys=new Set([cy]); starts.forEach(ym=>ys.add(+ym.slice(0,4))); Object.keys(inv).forEach(ym=>ys.add(+ym.slice(0,4)));
  const years=[...ys].sort((a,c)=>a-c);
  let grid=`<div class="yh"></div>`+Array.from({length:12},(_,i)=>`<div class="yh">${i+1}</div>`).join("");
  const rows=[];
  for(const y of years){
    let gS=0,aS=0,iS=0;
    grid+=`<div class="yl">${y}</div>`;
    for(let i=0;i<12;i++){
      const ym=ymOf(y,i), g=ym>=startYm?goalFor(y,i):0, a=act[ym]||0, fut=ym>curYm;
      gS+=g; aS+=a; iS+=inv[ym]||0;
      let c="yc", st="", txt="";
      if(fut){ c+=" fut"; }
      else if(g){ const r=a/g; txt=Math.min(999,Math.round(r*100)); st = r>=1 ? "background:var(--red);color:#fff" : `background:color-mix(in srgb, var(--red) ${Math.round(10+r*50)}%, var(--cell0))`; }
      else if(a>0){ txt="·"; }
      if(ym===curYm) c+=" now";
      grid+=`<div class="${c}" style="${st}" title="${y}년 ${i+1}월 · 받은 배당 ${won(a)}${g?` / 목표 ${won(g)}`:""}${inv[ym]?` · 투자 ${inv[ym]}만원`:""}">${txt}</div>`;
    }
    rows.push(`<tr${y===cy?' class="cur"':""}><td class="l"><b>${y}</b></td><td>${gS?man(gS):"-"}</td><td class="${aS?"amt":""}">${aS?man(aS):"-"}</td><td class="${gS&&y<=cy?(aS>=gS?"up":"down"):""}">${gS&&y<=cy?Math.round(aS/gS*100)+"%":"-"}</td><td>${iS?iS.toLocaleString("ko-KR",{maximumFractionDigits:1}):"-"}</td></tr>`);
  }
  return `<section class="card"><h2>연도별 한눈에 <small>${basisName()} 기준</small></h2>
    <div class="ygrid">${grid}</div>
    <p class="muted" style="font-size:12px;margin:8px 0 12px">칸 숫자는 그달 목표 대비 달성률(%)이에요. 빨간 칸은 목표 달성, 점선 칸은 아직 오지 않은 달이에요.</p>
    <div class="tbl"><table><thead><tr><th class="l">연도</th><th>연 목표</th><th>받은 배당</th><th>달성</th><th>투자금</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>
    <p class="muted" style="font-size:12px;margin:6px 0 0">금액 단위: 만원</p></section>`;
}
function investSumTxt(){
  const inv=investMap(), y=investYear; let yS=0, all=0;
  for(const ym in inv){ all+=inv[ym]; if(ym.startsWith(y+"-")) yS+=inv[ym]; }
  const f=n=>n.toLocaleString("ko-KR",{maximumFractionDigits:1});
  return `${y}년 투자 <b class="num">${f(yS)}만원</b> · 전체 누적 <b class="num">${f(all)}만원</b>`;
}
function investCard(){
  const now=new Date(), cy=now.getFullYear(), curYm=ymOf(cy,now.getMonth()), inv=investMap();
  const ys=new Set([cy]); S.plan.forEach(p=>ys.add(+p.ym.slice(0,4))); Object.keys(inv).forEach(ym=>ys.add(+ym.slice(0,4)));
  const years=[...ys].sort((a,c)=>a-c); if(!years.includes(investYear)) investYear=cy;
  const y=investYear;
  const rows=Array.from({length:12},(_,i)=>{ const ym=ymOf(y,i), p=planOf(ym), v=inv[ym];
    return `<tr${ym===curYm?' class="cur"':""}><td class="l"><b>${i+1}월</b></td><td class="l muted">${p&&p.invest?esc(p.invest):"-"}</td><td><input class="inv num" data-ym="${ym}" type="number" inputmode="decimal" step="any" min="0" value="${v||""}" placeholder="0" aria-label="${y}년 ${i+1}월 투자금액 (만원)"></td></tr>`; }).join("");
  return `<section class="card"><h2>월별 투자금액 <small>단위: 만원</small></h2>${yearChips("iychips",years,y)}
    <div class="tbl"><table><thead><tr><th class="l">월</th><th class="l">계획</th><th>실제 투자</th></tr></thead><tbody>${rows}</tbody></table></div>

function viewPlan(){
  const now=new Date(), curYm=ymOf(now.getFullYear(),now.getMonth()), b=basis(), st=S.settings, inv=investMap();
  const plan=[...S.plan].sort((a,c)=>a.ym.localeCompare(c.ym));
  const head=`<section class="card"><h2>배당 계획 <small>단위: 만원</small></h2>
    <div class="grid2"><div><label class="f" for="pby">기준 주배당 (%)</label><input id="pby" type="number" inputmode="decimal" step="0.01" value="${st.baseYield}"></div>

  if(!plan.length) return head+yearOverview()+`<section class="card"><div class="empty">아직 계획이 없어요.</div><div class="btnrow"><button id="pLoad">예상 배당금 계획 불러오기</button><button class="primary" id="pAdd">월 추가</button></div></section>`+investCard();
  const cur=planOf(curYm), P=portfolio();
  const curCard = cur ? (()=>{ const a=actualYm(curYm,b); return `<section class="card hero"><div class="label">${now.getMonth()+1}월 계획 · ${basisName()} 기준</div>
    <div class="big num">${man(a)}<span style="font-size:18px;color:var(--muted)"> / ${cur.expected}만원</span></div>
    <div class="bar"><span style="width:${Math.min(100,a/(cur.expected*10000)*100)}%"></span></div>
    <div class="stats" style="margin:14px 0 0">
      <div class="stat"><div class="k">계획 원금</div><div class="v num">${cur.principal.toLocaleString()}만</div></div>
      <div class="stat"><div class="k">현재 평가액</div><div class="v num ${P.tVal/10000>=cur.principal?"up":"down"}">${P.tVal?man(P.tVal)+"만":"-"}</div></div>
    </div>${cur.memo?`<p class="muted" style="margin:10px 0 0">${esc(cur.memo)}</p>`:""}</section>`; })() : "";
  const labels=plan.map(p=>ymLabel(p.ym)), acts=plan.map(p=>p.ym<=curYm?actualYm(p.ym,b):0), exps=plan.map(p=>p.expected*10000);

    return `<tr data-plan="${p.id}"${p.ym===curYm?' class="cur"':""}><td class="l"><b>${ymLabel(p.ym)}</b></td><td>${p.principal.toLocaleString()}</td><td class="l">${esc(p.invest||"")}</td><td>${inv[p.ym]?inv[p.ym].toLocaleString("ko-KR",{maximumFractionDigits:1}):"-"}</td><td>${p.expected}</td><td class="amt">${past?man(a):"-"}</td><td class="${past?(r>=100?"up":"down"):""}">${past&&p.expected?Math.round(r)+"%":"-"}</td><td class="l muted" style="white-space:normal;min-width:150px">${esc(p.memo||"")}</td></tr>`; }).join("");
  return head+curCard+yearOverview()+`
  <section class="card"><h2>예상 vs 실제 <small>${basisName()}</small></h2>${barChart({labels,values:acts,target:exps,labelEvery:Math.max(1,Math.ceil(plan.length/8))})}

  <p class="muted" style="font-size:12px;margin:-6px 2px 12px">행을 누르면 그달 계획을 고칠 수 있어요.</p>

// ---------- sheets ----------
function openSheet(html, bind){ const o=$("#sheet"), n=o.cloneNode(false); o.replaceWith(n); n.innerHTML=html; $("#sheetBg").classList.add("open"); bind&&bind(); }
function closeSheet(){ $("#sheetBg").classList.remove("open"); softRender(); }
$("#sheetBg").addEventListener("click", e=>{ if(e.target.id==="sheetBg") closeSheet(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });

function autoFxInto(dateSel, fxSel, noteSel, onDone){
  const st={manual:false,src:"saved"};
  $(fxSel).addEventListener("input",()=>{ st.manual=true; $(noteSel).textContent="직접 입력한 환율"; });
  const run=async()=>{ if(st.manual || !S.settings.autoFx){ if(!S.settings.autoFx) $(noteSel).textContent="환율 자동 연동 꺼짐"; return; }
    const d=$(dateSel).value||todayStr(); $(noteSel).textContent="환율 불러오는 중…";
    const r=await getFx(d); if(st.manual||!document.body.contains($(fxSel))) return;
    st.src=r.src; $(fxSel).value=r.rate;
    $(noteSel).textContent = r.src==="offline" ? "오프라인 · 인터넷 연결되면 입금일 환율로 자동 수정돼요" : `${fmtD(parseD(d))} 환율 자동 적용${r.base&&r.base!==d?` (${fmtD(parseD(r.base))} 영업일 기준)`:""}`;
    onDone&&onDone(); };
  $(dateSel).addEventListener("change",()=>{ st.manual=false; run(); }); run();
  return st;
}

function batchSheet(){
  if(!S.holdings.length){
    openSheet(`<h3>먼저 종목을 등록해 주세요</h3><p class="hint">보유 종목과 수량을 등록해 두면, 매주 주당 배당금만 입력해 한 번에 기록할 수 있어요.</p>
      <div class="btnrow"><button class="ghost" id="bx">닫기</button><button class="primary" id="bgo">종목 추가</button></div>`, ()=>{ $("#bx").onclick=closeSheet; $("#bgo").onclick=()=>holdSheet(); });
    return;
  }
  const items=S.holdings.map(h=>`<div class="batch-item" data-h="${h.id}">
    <div class="top"><label class="chk"><input type="checkbox" checked> ${esc(h.ticker)}</label><span class="muted num" style="font-size:12px">${h.shares.toLocaleString()}주</span></div>
    <div class="grid2"><div><label class="f">주당 배당 (${h.currency==="KRW"?"원":"$"})</label><input class="ps" type="number" inputmode="decimal" step="any" value="${lastPerShare(h.ticker)}" placeholder="0.00"></div>
    <div><label class="f">수량</label><input class="sh" type="number" inputmode="decimal" step="any" value="${h.shares}"></div></div>
    <div class="calc num"></div></div>`).join("");
  openSheet(`<h3>이번 주 배당 기록</h3><p class="hint">지난번 주당 배당금을 미리 채워 뒀어요. 환율과 그날 주가는 자동으로 들어가요.</p>
    <div class="grid2"><div><label class="f" for="bd">입금일</label><input id="bd" type="date" value="${todayStr()}"></div>
    <div><label class="f" for="bfx">환율</label><input id="bfx" type="number" inputmode="decimal" step="0.01" value="${S.settings.fx}"></div></div>
    <div class="calc" id="bfxn"></div>
    ${items}
    <div class="preview num" id="bsum"></div>
    <div class="btnrow" style="margin-top:14px"><button class="ghost" id="bx">취소</button><button class="primary" id="bsave">기록 저장</button></div>`, ()=>{
      const upd=()=>{ let tot=0; const fx=+$("#bfx").value||0;
        $("#sheet").querySelectorAll(".batch-item").forEach(el=>{ const h=S.holdings.find(x=>x.id===el.dataset.h), on=el.querySelector("input[type=checkbox]").checked;
          const ps=+el.querySelector(".ps").value||0, sh=+el.querySelector(".sh").value||0;
          const c=calc({ticker:h.ticker,perShare:ps,shares:sh,taxRate:taxFor(h.currency),fx,currency:h.currency,price:curPrice(h)});
          el.querySelector(".calc").textContent = ps? `세후 ${h.currency==="KRW"?"":usd(c.net)+" · "}${won(c.netKRW)}${c.yield!=null?` · 현재가 대비 ${c.yield.toFixed(2)}%`:""}` : "";
          el.style.opacity=on?1:.45; if(on) tot+=c.netKRW; });
        $("#bsum").textContent=`이번 주 세후 합계 ${won(tot)}`; };
      $("#sheet").addEventListener("input",upd); upd();
      const fxs=autoFxInto("#bd","#bfx","#bfxn",upd);
      $("#bx").onclick=closeSheet;
      $("#bsave").onclick=()=>{
        const date=$("#bd").value||todayStr(), fx=+$("#bfx").value||S.settings.fx; let n=0;
        $("#sheet").querySelectorAll(".batch-item").forEach(el=>{
          if(!el.querySelector("input[type=checkbox]").checked) return;
          const h=S.holdings.find(x=>x.id===el.dataset.h), ps=+el.querySelector(".ps").value, sh=+el.querySelector(".sh").value;
          if(!(ps>0)||!(sh>0)) return;
          const cached = S.priceCache[h.ticker] && S.priceCache[h.ticker][date];
          S.entries.push({id:uid(),created:Date.now(),updated:Date.now(),date,ticker:h.ticker,perShare:ps,shares:sh,taxRate:taxFor(h.currency),fx,currency:h.currency,memo:"",
            fxAuto:!fxs.manual&&S.settings.autoFx, fxPending:h.currency!=="KRW"&&!fxs.manual&&S.settings.autoFx&&fxs.src==="offline",
            price: h.currency==="KRW" ? (h.manualPrice||null) : (cached||null)});
          if(sh!==h.shares){ h.shares=sh; h.updated=Date.now(); } n++;
        });
        if(!n){ toast("주당 배당금을 입력해 주세요"); return; }
        persist(); closeSheet(); render(); toast(`${n}건 기록했어요`); backfillPrices();
      };
    });
}

function entrySheet(id){
  const e=id?S.entries.find(x=>x.id===id):null, h0=S.holdings[0];
  let cur=e?e.currency:(h0?h0.currency:"USD");
  const tickers=[...new Set([...S.holdings.map(h=>h.ticker),...S.entries.map(x=>x.ticker)])];
  openSheet(`<h3>${e?"기록 수정":"배당 기록"}</h3>
    <label class="f" for="et">종목</label><input id="et" list="tl" value="${esc(e?e.ticker:(h0?h0.ticker:""))}" placeholder="예: SPYI" autocapitalize="characters">
    <datalist id="tl">${tickers.map(t=>`<option value="${esc(t)}">`).join("")}</datalist>
    <div class="grid2"><div><label class="f" for="ed">입금일</label><input id="ed" type="date" value="${e?e.date:todayStr()}"></div>
    <div><label class="f">통화</label><div class="seg" id="ec"><button type="button" data-c="USD" aria-pressed="${cur==="USD"}">USD</button><button type="button" data-c="KRW" aria-pressed="${cur==="KRW"}">KRW</button></div></div></div>
    <div class="grid2"><div><label class="f" for="ep">주당 배당</label><input id="ep" type="number" inputmode="decimal" step="any" value="${e?e.perShare:""}"></div>

    <div class="grid2"><div><label class="f" for="ex">세율 (%)</label><input id="ex" type="number" inputmode="decimal" step="0.1" value="${e?e.taxRate:taxFor(cur)}"></div>
    <div><label class="f" for="ef">환율</label><input id="ef" type="number" inputmode="decimal" step="0.01" value="${e?e.fx:S.settings.fx}"></div></div>
    <div class="calc" id="efn">${e?(e.fxAuto?"입금일 환율 자동 적용":"저장된 환율"):""}</div>
    <label class="f" for="epr">입금일 주가 <span id="eprn">(비우면 자동)</span></label><input id="epr" type="number" inputmode="decimal" step="any" value="${e&&e.price?e.price:""}" placeholder="자동">
    <label class="f" for="em">메모</label><input id="em" value="${esc(e?e.memo:"")}" placeholder="선택">
    <div class="preview num" id="epv"></div>
    <div class="btnrow" style="margin-top:14px">${e?`<button class="danger" id="edel">삭제</button>`:""}<button class="ghost" id="ecx">취소</button><button class="primary" id="esv">저장</button></div>`, ()=>{
      const upd=()=>{ const r=calc({ticker:$("#et").value.trim().toUpperCase(),perShare:+$("#ep").value||0,shares:+$("#es").value||0,taxRate:+$("#ex").value||0,fx:+$("#ef").value||0,currency:cur,price:+$("#epr").value||null});
        $("#epv").textContent=`세전 ${cur==="KRW"?won(r.gross):usd(r.gross)} → 세후 ${won(r.netKRW)}${r.yield!=null?` · 주가 대비 ${r.yield.toFixed(2)}%`:""}`; $("#ef").disabled=cur==="KRW"; };
      const setCur=c=>{ cur=c; $("#ec").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.c===c)); $("#ex").value=taxFor(c); upd(); };

      else { $("#ef").addEventListener("input",()=>{ fxs.manual=true; }); $("#ed").addEventListener("change",()=>{ if(S.settings.autoFx&&!fxs.manual) getFx($("#ed").value).then(r=>{ fxs.src=r.src; $("#ef").value=r.rate; $("#efn").textContent="입금일 환율 자동 적용"; upd(); }); }); }
      let priceTouched=false; $("#epr").addEventListener("input",()=>priceTouched=true);
      $("#ecx").onclick=closeSheet;

        persist(); closeSheet(); toast("저장했어요"); backfillPrices(); backfillFx();
      };
    });
}

function holdSheet(id){
  const h=id?S.holdings.find(x=>x.id===id):null; let cur=h?h.currency:"USD";
  const c0=h&&h.currency!=="KRW"?holdCalc(h):null;
  const r2=(n,d)=>n?Math.round(n*10**d)/10**d:"";
  const vU=c0?r2(c0.aU,4):"", vK=c0?r2(c0.aK,2):"", vW=h&&h.currency==="KRW"?(h.avgCost||""):"";
  openSheet(`<h3>${h?"종목 수정":"종목 추가"}</h3>
    <label class="f" for="ht">티커 / 종목명</label><input id="ht" value="${esc(h?h.ticker:"")}" placeholder="예: SPYI, QQQI, YMAX" autocapitalize="characters">
    <div class="grid2"><div><label class="f" for="hs">보유 수량</label><input id="hs" type="number" inputmode="decimal" step="any" value="${h?h.shares:""}"></div>
    <div><label class="f">상장 시장</label><div class="seg" id="hc"><button type="button" data-c="USD" aria-pressed="${cur==="USD"}">미국 $</button><button type="button" data-c="KRW" aria-pressed="${cur==="KRW"}">국내 ₩</button></div></div></div>
    <div id="husd"><div class="grid2"><div><label class="f" for="hau">달러 평단 ($)</label><input id="hau" type="number" inputmode="decimal" step="any" value="${vU}" placeholder="예: 50.12"></div>
      <div><label class="f" for="hak">원화 평단 (₩, 1주)</label><input id="hak" type="number" inputmode="decimal" step="any" value="${vK}" placeholder="예: 68000"></div></div>
      <p class="calc" style="margin:4px 0 0">증권사 앱의 달러 평단과 원화 평단을 그대로 옮겨 적으세요. 여러 번 나눠 산 환율이 원화 평단에 이미 반영돼 있어서, 평균 매수 환율은 자동으로 계산돼요.</p></div>
    <div id="hkrw"><label class="f" for="haw">평균 매수가 (원)</label><input id="haw" type="number" inputmode="decimal" step="any" value="${vW}"></div>
    <div class="preview num" id="hpv" style="font-size:13px"></div>
    <div class="grid2"><div><label class="f" for="hm">현재가 직접 입력 <span class="hcur"></span></label><input id="hm" type="number" inputmode="decimal" step="any" value="${h&&h.manualPrice?h.manualPrice:""}" placeholder="자동이면 비워 두기"></div>
    <div><label class="f" for="hf">지급 주기</label><select id="hf">${["주배당","월배당","분기배당"].map(f=>`<option ${h&&h.freq===f?"selected":""}>${f}</option>`).join("")}</select></div></div>
    <label class="f" for="hp">지급 요일 (선택)</label><input id="hp" value="${esc(h?h.payday||"":"")}" placeholder="예: 금요일">
    <div class="btnrow" style="margin-top:14px">${h?`<button class="danger" id="hdel">삭제</button>`:""}<button class="ghost" id="hcx">취소</button><button class="primary" id="hsv">저장</button></div>`, ()=>{
      const upd=()=>{ const us=cur!=="KRW", fx=S.settings.fx; $("#husd").hidden=!us; $("#hkrw").hidden=us;
        document.querySelectorAll(".hcur").forEach(x=>x.textContent=`(${us?"$":"원"})`);
        const aU=+$("#hau").value||0, aK=+$("#hak").value||0, sh=+$("#hs").value||0, t=$("#ht").value.trim().toUpperCase(), pv=$("#hpv");
        const p = us ? (S.quotes[t]?S.quotes[t].price:(+$("#hm").value||0)) : 0;
        let msg="";
        if(!us){ msg = /^[A-Z][A-Z0-9.\-]{0,6}$/.test(t) ? "국내 종목은 현재가를 직접 넣어야 해요. 미국 주식을 원화로 샀다면 시장은 ‘미국’을 고르고 원화 평단 칸에 넣으세요." : ""; }
        else if(aU&&aK){ const bf=aK/aU; msg=`평균 매수 환율 ${bf.toLocaleString("ko-KR",{maximumFractionDigits:1})}원 · 오늘 ${fx.toLocaleString()}원`;
          if(p) msg+=`<br>수익률 달러 ${pct((p-aU)/aU*100)} · 원화 ${pct((p*fx-aK)/aK*100)}`; }
        else if(aK) msg="달러 평단도 넣으면 환차손익과 달러 기준 수익률을 따로 볼 수 있어요.";
        else if(aU) msg=`원화 평단이 없으면 오늘 환율(${fx.toLocaleString()}원)로 원금을 계산해서 환차손익이 0으로 보여요.`;
        pv.innerHTML=msg; pv.hidden=!msg; };
      $("#hc").onclick=ev=>{ const b=ev.target.closest("button"); if(!b) return; cur=b.dataset.c; $("#hc").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.c===cur)); upd(); };
      $("#sheet").addEventListener("input",upd); upd();
      $("#hcx").onclick=closeSheet;
      if(h) $("#hdel").onclick=()=>{ if(!confirm("종목을 삭제할까요? 지난 배당 기록은 남아 있어요.")) return; S.holdings=S.holdings.filter(x=>x.id!==h.id); markDeleted(h.id); persist(); closeSheet(); };
      $("#hsv").onclick=()=>{
        const t=$("#ht").value.trim().toUpperCase(), sh=+$("#hs").value;
        if(!t||!(sh>0)){ toast("티커와 수량을 입력해 주세요"); return; }
        const rec={ticker:t,shares:sh,currency:cur,manualPrice:+$("#hm").value||0,freq:$("#hf").value,payday:$("#hp").value.trim(),updated:Date.now(),krwOk:cur==="KRW"};
        if(cur==="KRW"){ Object.assign(rec,{avgCost:+$("#haw").value||0,avgCostKRW:0,buyFx:0,avgCur:"KRW"}); }
        else { const aU=+$("#hau").value||0, aK=+$("#hak").value||0; Object.assign(rec,{avgCost:aU,avgCostKRW:aK,buyFx:aU&&aK?Math.round(aK/aU*100)/100:0,avgCur:aK&&!aU?"KRW":"USD"}); }
        if(h) Object.assign(h,rec); else S.holdings.push(Object.assign({id:uid()},rec));
        persist(); closeSheet(); tab="hold"; toast("저장했어요"); refreshQuotes(true);
      };
    });
}

function loadPdfPlan(){
  const now=Date.now();
  for(const [ym,principal,invest,expected,memo] of PDF_PLAN){
    const id="plan-"+ym; S.deleted=S.deleted.filter(x=>x!==id);
    const rec={id,ym,principal,invest,expected,memo,updated:now};
    const i=S.plan.findIndex(p=>p.ym===ym); if(i>=0) S.plan[i]=Object.assign(S.plan[i],rec,{id:S.plan[i].id}); else S.plan.push(rec);
  }
  S.settings.planSeeded=true;
}
function planSheet(id){
  const p=id?S.plan.find(x=>x.id===id):null;
  const nextYm=(()=>{ const last=[...S.plan].map(x=>x.ym).sort().pop(); if(!last) return ymOf(new Date().getFullYear(),new Date().getMonth()); const [y,m]=last.split("-").map(Number); return m===12?ymOf(y+1,0):ymOf(y,m); })();
  openSheet(`<h3>${p?ymLabel(p.ym)+" 계획 수정":"월 계획 추가"}</h3><p class="hint">금액 단위는 만원이에요.</p>
    <label class="f" for="pym">월</label><input id="pym" type="month" value="${p?p.ym:nextYm}">
    <div class="grid2"><div><label class="f" for="ppr">원금 (만원)</label><input id="ppr" type="number" inputmode="numeric" value="${p?p.principal:""}"></div>
    <div><label class="f" for="pex">예상 배당 (만원)</label><input id="pex" type="number" inputmode="decimal" step="any" value="${p?p.expected:""}"></div></div>
    <div class="btnrow" style="margin-top:8px"><button class="small ghost" id="pauto">원금 × ${S.settings.baseYield}% × 4로 계산</button></div>
    <label class="f" for="pin">투자 (예: 130+12(배당금))</label><input id="pin" value="${esc(p?p.invest:"")}">
    <label class="f" for="pme">메모 (변동값, 재투자, QLD 등)</label><input id="pme" value="${esc(p?p.memo:"")}">
    <div class="btnrow" style="margin-top:14px">${p?`<button class="danger" id="pdel">삭제</button>`:""}<button class="ghost" id="pcx">취소</button><button class="primary" id="psv">저장</button></div>`, ()=>{
      $("#pauto").onclick=()=>{ const pr=+$("#ppr").value||0; $("#pex").value=Math.floor(pr*S.settings.baseYield/100*4); };
      $("#pcx").onclick=closeSheet;
      if(p) $("#pdel").onclick=()=>{ if(!confirm("이 달 계획을 삭제할까요?")) return; S.plan=S.plan.filter(x=>x.id!==p.id); markDeleted(p.id); persist(); closeSheet(); };
      $("#psv").onclick=()=>{
        const ym=$("#pym").value, pr=+$("#ppr").value, ex=+$("#pex").value;
        if(!/^\d{4}-\d{2}$/.test(ym)||!(ex>0)){ toast("월과 예상 배당을 입력해 주세요"); return; }
        const dup=S.plan.find(x=>x.ym===ym && (!p||x.id!==p.id)); if(dup){ toast("이미 그 달 계획이 있어요"); return; }
        const rec={ym,principal:pr||0,expected:ex,invest:$("#pin").value.trim(),memo:$("#pme").value.trim(),updated:Date.now()};
        if(p) Object.assign(p,rec); else S.plan.push(Object.assign({id:"plan-"+ym},rec));
        S.deleted=S.deleted.filter(x=>x!=="plan-"+ym||(p&&p.id===x));
        persist(); closeSheet(); toast("저장했어요");
      };
    });
}

// ---------- files ----------
function saveFile(name,text,type){
  const blob=new Blob([text],{type}), url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast("파일을 저장했어요");
}
function exportCSV(){
  const head=["입금일","주차(월요일)","종목","통화","주당배당","수량","세전","세율(%)","세금","세후","환율","세후(원)","입금일주가","주가대비(%)","연환산(%)","메모"];
  const rows=[...S.entries].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>{ const c=calc(e);
    return [e.date,weekKey(e.date),e.ticker,e.currency,e.perShare,e.shares,c.gross.toFixed(4),e.taxRate,c.tax.toFixed(4),c.net.toFixed(4),e.currency==="KRW"?1:e.fx,Math.round(c.netKRW),e.price||"",c.yield!=null?c.yield.toFixed(3):"",c.yieldAnnual!=null?c.yieldAnnual.toFixed(2):"",e.memo||""]; });
  const csv="\uFEFF"+[head,...rows].map(r=>r.map(v=>{ const s=String(v); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; }).join(",")).join("\n");
  saveFile(`배당일지_${todayStr()}.csv`,csv,"text/csv;charset=utf-8");
}

// ---------- bindings ----------
function bindView(){
  const v=$("#view"), on=(sel,fn)=>{ const el=v.querySelector(sel); if(el) el.onclick=fn; };
  v.querySelectorAll("[data-edit]").forEach(r=>r.onclick=()=>entrySheet(r.dataset.edit));
  v.querySelectorAll("[data-hold]").forEach(r=>r.onclick=()=>holdSheet(r.dataset.hold));
  on("#addOne",()=>entrySheet()); on("#addHold",()=>holdSheet()); on("#csvLog",exportCSV);
  const ls=v.querySelector("#lseg"); if(ls) ls.onclick=ev=>{ const b=ev.target.closest("button"); if(b){ logMode=b.dataset.m; render(); } };
  const tc=v.querySelector("#tchips"); if(tc) tc.onclick=ev=>{ const b=ev.target.closest("button"); if(b){ tickerSel=b.dataset.t; render(); } };
  v.querySelectorAll("[data-plan]").forEach(r=>r.onclick=()=>planSheet(r.dataset.plan));
  on("#goPlan",()=>{ tab="plan"; render(); window.scrollTo(0,0); });
  const hy=v.querySelector("#hychips"); if(hy) hy.onclick=ev=>{ const b=ev.target.closest("button"); if(b){ homeYear=+b.dataset.y; render(); } };
  const iy=v.querySelector("#iychips"); if(iy) iy.onclick=ev=>{ const b=ev.target.closest("button"); if(b){ investYear=+b.dataset.y; render(); } };
  const invs=[...v.querySelectorAll("input.inv")];
  invs.forEach((inp,k)=>{
    inp.onchange=()=>{ const ym=inp.dataset.ym, n=Math.max(0,+inp.value||0), id="inv-"+ym, x=S.invest.find(r=>r.ym===ym);
      if(x){ x.amount=n; x.updated=Date.now(); } else if(n>0){ S.deleted=S.deleted.filter(d=>d!==id); S.invest.push({id,ym,amount:n,created:Date.now(),updated:Date.now()}); }
      persist(); const sm=$("#invSum"); if(sm) sm.innerHTML=investSumTxt(); softRender(); };
    inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); inp.dispatchEvent(new Event("change")); const nx=invs[k+1]; if(nx) nx.focus(); else inp.blur(); } };
  });
  on("#fixKrw",()=>{ const fx=S.settings.fx; let ent=0;
    oddKrw().forEach(h=>{ h.currency="USD"; if(h.avgCost){ h.avgCostKRW=h.avgCost; h.avgCur="KRW"; h.avgCost=0; }
      if(h.manualPrice) h.manualPrice=Math.round(h.manualPrice/fx*100)/100; h.updated=Date.now();
      ent+=S.entries.filter(e=>e.ticker===h.ticker&&e.currency==="KRW").length; });
    persist(); render(); toast(ent?`미국 종목으로 바꿨어요. 원화로 저장된 배당 기록 ${ent}건은 기록 탭에서 통화를 확인해 주세요`:"미국 종목으로 바꿨어요. 종목을 눌러 매수 환율도 넣어 보세요"); refreshQuotes(true); });
  on("#keepKrw",()=>{ oddKrw().forEach(h=>{ h.krwOk=true; h.updated=Date.now(); }); persist(); render(); });
  on("#pAdd",()=>planSheet());
  on("#pLoad",()=>{ if(S.plan.length && !confirm("PDF 계획(2026.9~2028.9)을 다시 불러올까요? 같은 달 계획은 PDF 내용으로 바뀌어요.")) return; loadPdfPlan(); persist(); render(); toast("계획을 불러왔어요"); });
  on("#pClear",()=>{ if(!confirm("계획을 모두 삭제할까요?")) return; S.plan.forEach(x=>markDeleted(x.id)); S.plan=[]; persist(); render(); });
  const pb=v.querySelector("#pbasis"); if(pb) pb.onclick=ev=>{ const b=ev.target.closest("button"); if(b){ S.settings.goalBasis=b.dataset.b; touchSettings(); persist(); render(); } };
  const py=v.querySelector("#pby"); if(py) py.onchange=()=>{ const n=+py.value; if(n>0){ S.settings.baseYield=n; touchSettings(); persist(); toast("기준 주배당을 저장했어요"); } };
  on("#refQ",async()=>{ toast("주가를 불러오는 중…"); if(await refreshQuotes(true)) toast("주가를 새로 불러왔어요"); });
  const cs=v.querySelector("#cseg"); if(cs) cs.onclick=ev=>{ const b=ev.target.closest("button"); if(b){ chartMode=b.dataset.m; render(); } };
  on("#goGoal",()=>{ tab="set"; render(); setTimeout(()=>{ const g=$("#sgoal"); g&&g.focus(); },50); });
  const sa=v.querySelector("#sauto"); if(sa) sa.onchange=()=>{ $("#manualFx").hidden=sa.checked; };
  on("#fxRef",async()=>{ toast("환율을 불러오는 중…"); const r=await getFx(todayStr()); if(r.src==="offline") toast("인터넷 연결을 확인해 주세요"); else { S.settings.fx=r.rate; S.settings.fxDate=todayStr(); touchSettings(); persist(); render(); toast("환율을 갱신했어요"); } });
  on("#saveSet",()=>{ const st=S.settings; st.goalMonthly=+$("#sgoal").value||0; st.autoFx=$("#sauto").checked; if(!st.autoFx) st.fx=+$("#sfx").value||st.fx;
    st.taxUS=+$("#stu").value; st.taxKR=+$("#stk").value; touchSettings(); persist(); render(); toast("저장했어요"); if(st.autoFx) refreshTodayFx(); });
  const sg=v.querySelector("#sgoal"); if(sg) sg.onchange=()=>{ S.settings.goalMonthly=+sg.value||0; touchSettings(); persist(); toast("목표를 저장했어요"); };
  on("#tdSave",async()=>{ S.settings.tdKey=$("#std").value.trim(); touchSettings(); persist();
    if(!S.settings.tdKey){ render(); toast("키를 지웠어요"); return; }
    try{ const j=await TD.call("price?symbol=SPY"); toast(j.price?"연결 성공! 주가를 불러올게요":"키를 확인해 주세요"); S.entries.forEach(e=>e.priceFail=false); refreshQuotes(true); backfillPrices(); }
    catch(e){ toast("키가 맞지 않거나 인터넷 연결이 없어요"); } render(); });
  on("#gLink",()=>{ const idv=$("#sgc").value.trim(); if(!idv){ toast("클라이언트 ID를 먼저 넣어 주세요"); return; }
    if(idv!==S.settings.gClientId){ S.settings.gClientId=idv; Drive.token=null; touchSettings(); saveLocal(); } Drive.sync(true); });
  on("#gUnlink",()=>{ if(!confirm("구글 연동을 해제할까요? 이 기기의 기록은 그대로 남아요.")) return;
    try{ if(Drive.token && window.google) google.accounts.oauth2.revoke(Drive.token,()=>{}); }catch(e){}
    Drive.token=null; Drive.fileId=null; S.settings.gLinked=false; saveLocal(); render(); });
  const th=v.querySelector("#themes"); if(th) th.onclick=ev=>{ const b=ev.target.closest("button"); if(b){ applyTheme(b.dataset.t); render(); } };
  on("#csv",exportCSV);
  on("#syOut",()=>saveFile(`주배당_백업_${todayStr()}.json`,JSON.stringify(S),"application/json"));
  const si=v.querySelector("#syIn"), sf=v.querySelector("#syFile");
  if(si){ si.onclick=()=>sf.click(); sf.onchange=async()=>{ const f=sf.files[0]; if(!f) return;
    try{ const p=JSON.parse(await f.text()); if(!p||!Array.isArray(p.entries)) throw 0; const n=mergeIn(p); persist(); render(); toast(`합쳤어요 · 새 기록 ${n}건`); }
    catch(e){ toast("파일 형식이 맞지 않아요"); } sf.value=""; }; }
  on("#wipe",()=>{ if(!confirm("이 기기의 모든 종목과 기록을 삭제할까요? 구글에 동기화된 데이터는 남아 있어요.")) return;
    const keep={tdKey:S.settings.tdKey,gClientId:S.settings.gClientId}; S=clone(DEFAULT); Object.assign(S.settings,keep); saveLocal(); render(); toast("삭제했어요"); });
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; render(); window.scrollTo(0,0); if(tab==="hold") refreshQuotes(false); });
$("#fab").onclick=batchSheet;
$("#syncChip").onclick=()=>{ if(S.settings.gLinked||S.settings.gClientId) Drive.sync(true); else { tab="set"; render(); toast("설정에서 구글 계정을 연결할 수 있어요"); } };

// ---------- start ----------
async function backgroundWork(){ await refreshTodayFx(); await backfillFx(); await refreshQuotes(false); await backfillPrices(); }
loadLocal();
if(!S.settings.planSeeded && !S.plan.length){ loadPdfPlan(); saveLocal(); }
render();
backgroundWork();
window.addEventListener("online", ()=>{ backgroundWork(); if(Drive.ready()) Drive.sync(false); });
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible"){ if(S.settings.fxDate!==todayStr()) refreshTodayFx(); if(Drive.ready()) Drive.sync(false); } });
})();
