<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주배당 통장</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0D12" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="주배당 통장">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top"><h1><span class="app">주배당 통장</span><span class="pg"></span></h1><div class="hdr-r"><button class="chip ico" id="eyeBtn" type="button" aria-pressed="false" aria-label="금액 숨기기"></button><button class="chip" id="syncChip" type="button">이 기기에 저장됨</button></div></header>
  <main id="view"></main>
</div>
<button class="fab" id="fab">+ 이번 주 배당</button>
<nav class="tabs"><div class="brand"><img src="icon-192.png" alt="" width="30" height="30"><span>주배당 통장</span></div><div class="in" role="tablist">
  <button role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg><span>홈</span></button>
  <button role="tab" data-tab="hold" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13.5A8.5 8.5 0 1 1 10.5 3.5v8.5z"/><path d="M14 3.2a8.5 8.5 0 0 1 6.8 6.8H14z"/></svg><span>포트폴리오</span></button>
  <button role="tab" data-tab="div" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14.5" r="1" fill="currentColor"/><circle cx="12" cy="14.5" r="1" fill="currentColor"/><circle cx="15.5" cy="14.5" r="1" fill="currentColor"/></svg><span>배당</span></button>
  <button role="tab" data-tab="chart" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 4v16.5H20"/><path d="m7.5 15 3.6-4.6 3 2.8 4.9-6.2"/></svg><span>분석</span></button>
  <button role="tab" data-tab="set" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg><span>설정</span></button>
</div></nav>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script src="js/core.js"></script>
<script src="js/drive.js"></script>
<script src="js/calc.js"></script>
<script src="js/views.js"></script>
<script src="js/renewal.js"></script>
<script src="js/sheets.js"></script>
<script src="js/app.js"></script>
</body>
</html>
