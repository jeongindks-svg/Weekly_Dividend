<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주배당 통장</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="주배당 통장">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top"><h1><span class="app">주배당 통장</span><span class="pg"></span></h1><div class="hdr-r"><button class="chip ico" id="eyeBtn" type="button" aria-pressed="false" aria-label="금액 숨기기"></button><button class="chip" id="syncChip" type="button">이 기기에 저장됨</button></div></header>
  <main id="view"></main>
</div>
<button class="fab" id="fab">+ 이번 주 배당</button>
<nav class="tabs"><div class="brand"><img src="icon-192.png" alt="" width="30" height="30"><span>주배당 통장</span></div><div class="in" role="tablist">
  <button role="tab" data-tab="home" aria-selected="true">요약</button>
  <button role="tab" data-tab="log" aria-selected="false">기록</button>
  <button role="tab" data-tab="hold" aria-selected="false">보유</button>
  <button role="tab" data-tab="chart" aria-selected="false">그래프</button>
  <button role="tab" data-tab="plan" aria-selected="false">계획</button>
  <button role="tab" data-tab="set" aria-selected="false">설정</button>
</div></nav>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script src="js/core.js"></script>
<script src="js/drive.js"></script>
<script src="js/calc.js"></script>
<script src="js/views.js"></script>
<script src="js/sheets.js"></script>
<script src="js/app.js"></script>
</body>
</html>
